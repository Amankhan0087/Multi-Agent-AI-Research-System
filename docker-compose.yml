version: "3.9"

services:
  researchmind:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: researchmind
    image: researchmind:latest
    ports:
      - "8501:8501"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
